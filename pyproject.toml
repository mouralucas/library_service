[tool.ruff]
src = ["."]
line-length = 150
target-version = "py311"

exclude = [
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "alembic",
]

[tool.ruff.lint]
select = [
    "F",    # pyflakes (basic errors)
    "E",    # pycodestyle (style)
    "W",    # pycodestyle warnings
    "I",    # isort (import order)
    "N",    # pep8-naming (functions/variables/classes names)
    "UP",   # pyupgrade (syntaxe upgrades)
    "C90",  # mccabe (complexity)
]

ignore = []

