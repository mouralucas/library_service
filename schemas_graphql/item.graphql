extend type Query {
  # Item queries
  getItem(id: Int!): Item
  getItems(params: GetItemRequest): GetItemResponse
}

extend type Mutation {
    createItem(name: String!): Item
}


input GetItemRequest {
  itemId: Int
  title: String
  mainAuthorId: Int
  itemType: String
}


type GetItemResponse {
    quantity: Int,
    items: [Item]
}

type Item {
  itemId: ID!
  mainAuthorId: Int!
  mainAuthorName: String
  title: String!
  subtitle: String
  titleOriginal: String
  subtitleOriginal: String
  isbn: String
  isbn10: String
  type: String
  pages: Int
  volume: Int
  edition: Int
  publicationDate: String
  originalPublicationDate: String
  serieId: String
  serieName: String
  collectionId: String
  collectionName: String
  publisherId: String
  publisherName: String
  format: String
  languageId: String
  languageName: String
  coverPrice: Float
  paidPrice: Float

  lastStatusId: String
  lastStatusName: String
  lastStatusDate: String

  reading: Reading
}
