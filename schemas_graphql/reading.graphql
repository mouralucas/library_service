type CreateReadingResponse {
  reading: Reading!
}

type Reading {
  id: String!
  item_id: Int!
  item_title: String
  item: Item!
  start_date: String!
  finish_date: String
  number: Int
  active: Boolean
  status_id: String
  status_name: String
}

input ReadingInput {
  item_id: Int!
  start_date: String!
  finish_date: String
  is_dropped: Boolean = false
}

type ReadingOutput {
  item_title: String!
  quantity: Int!
  readings: [Reading!]
}