type Query {
    # Item queries
    getItem(id: Int!): Item
    getItems: GetItemResponse

    # Reading queries
    getReading(reading_id: String!): ReadingOutput!
    getReadings: ReadingOutput!
}

type Mutation {
    # Item mutations
    createItem(name: String!): Item

    # Reading mutations
    createReading(reading: ReadingInput!): CreateReadingResponse
}