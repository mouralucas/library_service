services:
  backend:
    image: 'mouralucas/rolf-services:library'
    build: .
    environment:
      - library_database_url=$library_database_url
    ports:
      - "8000:8000"

  nginx:
    restart: unless-stopped
    image: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    environment:
      - server_host={$server_host}
    logging:
      driver: "json-file"
      options:
        max-size: "100k"
        max-file: "1"

  pg_library_service:
    container_name: 'pg_library_service'
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: dev-user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: library_dev_db
    ports:
      - "5432:5432"
    expose:
      - "5432"
    volumes:
      - db-data:/var/lib/postgresql/data:cached

volumes:
  db-data: